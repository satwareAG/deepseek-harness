name: CI

# satware fork: the upstream workflow set assumed DeepSeek's private runners,
# secrets and merge-policy action. This is the only build/test lane we own.
# See docs/fork.md for the full disposition table.

on:
  pull_request:
  push:
    branches: [satware/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CLI ships an OTLP product-telemetry exporter; no CI or build step may
  # emit to it. Runtime suppression is proven separately by the egress test.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  gate:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test
